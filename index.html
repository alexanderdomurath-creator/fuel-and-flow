<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fuel & Flow — Kalorien, Rezepte & Habits</title>
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fuel & Flow" />
  <link id="apple-icon" rel="apple-touch-icon" />
  <link id="manifest-link" rel="manifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#09090b',
            card: '#121216',
            cardHover: '#18181d',
            border: '#24242b'
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-emerald-500/30">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-bg/90 backdrop-blur-md border-b border-border px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <button id="back-btn" onclick="goBack()" class="hidden px-2.5 py-1.5 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 text-xs font-medium text-zinc-200 border border-zinc-700/70 transition">
          ← Zurück
        </button>
        <div class="flex items-center gap-2.5">
          <div id="header-icon-box" class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center font-bold text-zinc-950 text-sm shadow-lg shadow-emerald-500/20">
            F&F
          </div>
          <div>
            <h1 class="text-sm font-semibold tracking-tight text-white leading-none">Fuel & Flow</h1>
            <p class="text-[11px] text-zinc-400 mt-0.5">Kalorien · Rezepte · Habits</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="openPwaModal()" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-xs font-medium transition">
          Installieren
        </button>
        <button onclick="openBackupModal()" class="px-2.5 py-1.5 rounded-xl bg-card hover:bg-cardHover border border-border text-zinc-300 text-xs transition" title="Daten sichern / wiederherstellen">
          Backup
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-content" class="max-w-3xl mx-auto px-4 pt-4 space-y-5"></main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-bg/95 backdrop-blur-md border-t border-border px-2 py-2">
    <div class="max-w-3xl mx-auto grid grid-cols-4 gap-1">
      <button onclick="switchTab('dashboard')" data-tab="dashboard" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">📊</span>
        <span>Heute</span>
      </button>
      <button onclick="switchTab('recipes')" data-tab="recipes" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">🥣</span>
        <span>Rezepte</span>
      </button>
      <button onclick="switchTab('search')" data-tab="search" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">🔍</span>
        <span>Food-Suche</span>
      </button>
      <button onclick="switchTab('habits')" data-tab="habits" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">⚡</span>
        <span>Habits</span>
      </button>
    </div>
  </nav>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-box" class="w-full sm:max-w-lg bg-card border border-border rounded-t-3xl sm:rounded-3xl p-5 max-h-[88vh] overflow-y-auto shadow-2xl"></div>
  </div>

  <!-- Ausgelagerte Anwendungslogik -->
  <script src="app.js"></script>
</body>
</html>
