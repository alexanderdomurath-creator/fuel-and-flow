<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fuel & Flow — Kalorien, Rezepte & Habits</title>
  <meta name="theme-color" content="#09090b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fuel & Flow" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link id="apple-icon" rel="apple-touch-icon" href="./icon-192.png" />
  <link id="manifest-link" rel="manifest" href="./manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#09090b',
            card: '#121216',
            cardHover: '#18181d',
            border: '#24242b'
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-emerald-500/30">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-bg/90 backdrop-blur-md border-b border-border px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <button id="back-btn" onclick="goBack()" class="hidden px-2.5 py-1.5 rounded-xl bg-zinc-800/90 hover:bg-zinc-700 text-xs font-medium text-zinc-200 border border-zinc-700/70 transition">
          ← Zurück
        </button>
        <div class="flex items-center gap-2.5">
          <div id="header-icon-box" class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center font-bold text-zinc-950 text-sm shadow-lg shadow-emerald-500/20">
            F&F
          </div>
          <div>
            <h1 class="text-sm font-semibold tracking-tight text-white leading-none">Fuel & Flow</h1>
            <p class="text-[11px] text-zinc-400 mt-0.5">Kalorien · Rezepte · Habits</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="langToggleBtn" onclick="toggleAppLanguage()" class="px-2.5 py-1.5 rounded-xl bg-card hover:bg-cardHover border border-border text-zinc-300 text-xs font-medium transition flex items-center gap-1" title="Sprache wechseln / Cambiar idioma">
          <span id="langBadgeDe" class="text-emerald-400 font-bold">DE</span><span class="text-zinc-600">/</span><span id="langBadgeEs" class="text-zinc-500">ES</span>
        </button>
        <button id="headerBackupBtn" onclick="openBackupModal()" class="px-2.5 py-1.5 rounded-xl bg-card hover:bg-cardHover border border-border text-zinc-300 text-xs font-medium transition" title="Daten sichern / wiederherstellen">
          Backup
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-content" class="max-w-3xl mx-auto px-4 pt-4 space-y-5"></main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-bg/95 backdrop-blur-md border-t border-border px-2 py-2">
    <div class="max-w-3xl mx-auto grid grid-cols-4 gap-1">
      <button onclick="switchTab('dashboard')" data-tab="dashboard" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">📊</span>
        <span>Heute</span>
      </button>
      <button onclick="switchTab('food')" data-tab="food" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">🍽️</span>
        <span>Food</span>
      </button>
      <button onclick="switchTab('sport')" data-tab="sport" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">🏋️</span>
        <span>Sport</span>
      </button>
      <button onclick="switchTab('habits')" data-tab="habits" class="nav-btn flex flex-col items-center py-1.5 rounded-xl text-xs font-medium transition">
        <span class="text-base mb-0.5">⚡</span>
        <span>Habits</span>
      </button>
    </div>
  </nav>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-box" class="w-full sm:max-w-lg bg-card border border-border rounded-t-3xl sm:rounded-3xl p-5 max-h-[88vh] overflow-y-auto shadow-2xl"></div>
  </div>

  <!-- Ausgelagerte Anwendungslogik -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=20261128-4"></script>
  <script src="sport.js?v=20261128-4"></script>

<!-- Barcode & Schnell-Portionierung Modal -->
  <div id="barcodeModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="w-full max-w-md rounded-2xl bg-zinc-900 border border-zinc-800 p-4 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-zinc-100">Barcode-Scanner & Portion</h3>
        <button onclick="closeBarcodeModal()" class="px-2 py-1 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 text-xs">✕</button>
      </div>

      <!-- Kamera-Viewport -->
      <div id="scannerCamWrapper" class="relative rounded-xl overflow-hidden bg-black border border-zinc-800 aspect-video flex items-center justify-center">
        <video id="barcodeVideo" class="w-full h-full object-cover" autoplay muted playsinline></video>
        <div class="pointer-events-none absolute inset-x-8 top-1/2 -translate-y-1/2 h-16 border-2 border-sky-400/70 rounded-lg shadow-[0_0_0_9999px_rgba(0,0,0,0.35)]"></div>
        <div id="scannerStatus" class="absolute bottom-2 inset-x-2 text-center text-[11px] text-zinc-200 bg-black/70 px-2 py-1 rounded-md">
          Kamera wird gestartet…
        </div>
      </div>

      <!-- Manueller EAN-Fallback -->
      <form onsubmit="handleManualBarcodeSubmit(event)" class="flex gap-2">
        <input id="manualBarcodeInput" type="text" inputmode="numeric" placeholder="EAN-Code manuell eingeben (z. B. 4000417025005)"
               class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500" />
        <button type="submit" class="px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium transition">
          Suchen
        </button>
      </form>

      <!-- Ergebnis & Schnell-Portionierung -->
      <div id="scannedFoodPanel" class="hidden rounded-2xl bg-zinc-950 border border-zinc-800 p-4 space-y-3.5">
        <div>
          <div id="scannedFoodName" class="text-sm font-semibold text-zinc-100 leading-snug"></div>
          <div id="scannedFoodBaseMacros" class="text-[11px] text-zinc-400 mt-0.5"></div>
        </div>

        <!-- Quick-Buttons -->
        <div id="portionQuickButtons" class="flex flex-wrap gap-1.5"></div>

        <!-- Vergrößerte Gramm-Eingabe mit Plus/Minus & Bestätigen -->
        <div class="space-y-2">
          <label class="text-xs font-medium text-zinc-300 block">Menge in Gramm</label>
          <div class="flex items-center gap-2">
            <button id="scanStepDownBtn" type="button" onclick="stepScannedGrams(-1)"
              class="px-3.5 py-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-sm font-bold text-zinc-200 shrink-0 transition">−10</button>
            <div class="flex-1 flex items-center gap-1.5 bg-zinc-900 border border-zinc-700 focus-within:border-emerald-500 rounded-xl px-3.5 py-2.5">
              <input id="scannedGramsInput" type="number" inputmode="decimal" min="1" max="5000" value="100"
                oninput="updateScannedPreview()"
                onkeydown="if(event.key==='Enter'){event.preventDefault(); confirmScannedPrimary();}"
                class="w-full bg-transparent text-lg font-bold text-white text-center focus:outline-none" />
              <span class="text-xs font-semibold text-zinc-400 shrink-0">g</span>
            </div>
            <button id="scanStepUpBtn" type="button" onclick="stepScannedGrams(1)"
              class="px-3.5 py-3 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-sm font-bold text-zinc-200 shrink-0 transition">+10</button>
            <button type="button" onclick="confirmScannedPrimary()" title="Gramm-Angabe bestätigen" aria-label="Bestätigen"
              class="px-4 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-sm font-bold shrink-0 transition">✓</button>
          </div>
          <div id="scannedLiveMacros" class="rounded-xl bg-zinc-900/90 border border-zinc-800 px-3 py-2 text-center text-xs font-semibold text-emerald-400"></div>
        </div>

        <!-- Übernehmen-Buttons -->
        <div class="flex gap-2 pt-1">
          <button id="btnAddScannedToRecipe" onclick="confirmScannedFood('recipe')" class="hidden flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-xs transition">
            ✓ Ins Rezept übernehmen
          </button>
          <button onclick="confirmScannedFood('log')" class="flex-1 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 font-semibold text-xs transition">
            + Ins Tages-Log
          </button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
